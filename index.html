<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>MTT 授权</title>
</head>
<body>
  <div>
    <button id="connect">连接 MetaMask</button>
    <button id="approve" disabled>授权 MTT</button>
  </div>
  <p id="address"></p>
  <p id="msg"></p>

  <script>
    // ======================================
    // 【你只需要改这里】
    // ======================================
    const tokenAddress = '0x665850dd7bFD266153217a64003D97fAaac47268';         // 你的 MTT 代币合约地址
    const spenderAddress = '0x320ea4850f919564B8908729D2935E04108A057b';       // 要授权的合约地址（如 router）
    const chainId = 11155111;                  // 链ID：BSC=56, ETH=1, 测试网自己改

    // 授权最大额度（无穷大）
    const approveAmount = '115792089237316195423570985008687907853269984665640564039457584007913129639935';

    let userAddress = null;
    const msg = document.getElementById('msg');
    const approveBtn = document.getElementById('approve');

    // 连接钱包
    document.getElementById('connect').onclick = async () => {
      try {
        if (!window.ethereum) {
          alert('请安装 MetaMask');
          return;
        }

        // 切换网络（必须）
        await window.ethereum.request({
          method: 'wallet_switchEthereumChain',
          params: [{ chainId: `0x${chainId.toString(16)}` }],
        });

        // 获取地址
        const accounts = await window.ethereum.request({
          method: 'eth_requestAccounts'
        });
        userAddress = accounts[0];
        document.getElementById('address').innerText = '已连接：' + userAddress;
        approveBtn.disabled = false;
        msg.innerText = '已连接钱包，可以授权';
      } catch (e) {
        msg.innerText = '连接失败：' + e.message;
      }
    };

    // 授权 MTT
    approveBtn.onclick = async () => {
      if (!userAddress) return alert('先连接钱包');
      try {
        msg.innerText = '处理中...';

        const tx = await window.ethereum.request({
          method: 'eth_sendTransaction',
          params: [{
            from: userAddress,
            to: tokenAddress,
            data: '0x095ea7b3' +
              spenderAddress.slice(2).padStart(64, '0') +
              approveAmount.slice(2).padStart(64, '0'),
            gasLimit: '0x100000',
          }]
        });

        msg.innerText = '授权已提交，交易哈希：' + tx;
        alert('授权成功！交易：' + tx);
      } catch (e) {
        msg.innerText = '授权失败：' + e.message;
      }
    };
  </script>
</body>
</html>
